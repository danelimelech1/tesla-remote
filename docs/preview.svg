<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="clip-client">
      <rect x="20" y="20" width="352" height="510" rx="10"/>
    </clipPath>
    <clipPath id="clip-server">
      <rect x="398" y="20" width="862" height="510" rx="10"/>
    </clipPath>
    <linearGradient id="screen-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1a2a3a"/>
      <stop offset="50%"  stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#162030"/>
    </linearGradient>
    <linearGradient id="btn-hover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f03035"/>
      <stop offset="100%" stop-color="#c01820"/>
    </linearGradient>
  </defs>

  <!-- ── Desktop background ─────────────────────────────────────────── -->
  <rect width="1280" height="560" fill="#0f0f0f"/>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!--  CLIENT WINDOW                                                   -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="352" height="510" rx="10" fill="#0d0d0d" stroke="#272727" stroke-width="1"/>

    <!-- title bar -->
    <rect x="20" y="20" width="352" height="38" rx="10" fill="#111111"/>
    <rect x="20" y="46" width="352" height="12" fill="#111111"/>
    <line x1="20" y1="58" x2="372" y2="58" stroke="#242424" stroke-width="1"/>
    <text x="196" y="43" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#484848">Tesla Remote – Client</text>
    <!-- traffic-light dots -->
    <circle cx="42" cy="39" r="5" fill="#FF5F57"/>
    <circle cx="58" cy="39" r="5" fill="#FEBC2E"/>
    <circle cx="74" cy="39" r="5" fill="#28C840"/>

    <!-- logo -->
    <text x="196" y="100" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#E82127" letter-spacing="3">TESLA REMOTE</text>
    <text x="196" y="120" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#404040">Screen Share  |  Client</text>
    <line x1="38" y1="136" x2="354" y2="136" stroke="#202020" stroke-width="1"/>

    <!-- Server IP -->
    <text x="38" y="160" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#BBBBBB">Server IP</text>
    <rect x="38" y="167" width="276" height="30" rx="7" fill="#181818" stroke="#2e2e2e" stroke-width="1"/>
    <text x="52" y="187" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#737373">192.168.1.100</text>

    <!-- Port -->
    <text x="38" y="223" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#BBBBBB">Port</text>
    <rect x="38" y="230" width="276" height="30" rx="7" fill="#181818" stroke="#2e2e2e" stroke-width="1"/>
    <text x="52" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#737373">7788</text>

    <!-- Quality slider -->
    <text x="38" y="285" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#BBBBBB">JPEG Quality</text>
    <text x="314" y="285" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#E82127">75%</text>
    <rect x="38" y="292" width="276" height="6" rx="3" fill="#1c1c1c"/>
    <rect x="38" y="292" width="190" height="6" rx="3" fill="#E82127"/>
    <circle cx="228" cy="295" r="8" fill="#E82127"/>

    <!-- FPS slider -->
    <text x="38" y="330" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#BBBBBB">Target FPS</text>
    <text x="314" y="330" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#E82127">20</text>
    <rect x="38" y="337" width="276" height="6" rx="3" fill="#1c1c1c"/>
    <rect x="38" y="337" width="75" height="6" rx="3" fill="#E82127"/>
    <circle cx="113" cy="340" r="8" fill="#E82127"/>

    <!-- CONNECT button -->
    <rect x="38" y="368" width="276" height="44" rx="8" fill="url(#btn-hover)"/>
    <text x="176" y="396" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1.5">CONNECT</text>

    <!-- status -->
    <text x="196" y="440" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#383838">Ready to connect</text>
  </g>

  <!-- window label -->
  <text x="196" y="548" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#3a3a3a">TeslaClient.exe  (Remote Machine)</text>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!--  SERVER WINDOW                                                   -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g filter="url(#shadow)">
    <rect x="398" y="20" width="862" height="510" rx="10" fill="#0b0b0b" stroke="#222222" stroke-width="1"/>

    <!-- top bar -->
    <rect x="398" y="20" width="862" height="48" rx="10" fill="#0e0e0e"/>
    <rect x="398" y="56" width="862" height="12" fill="#0e0e0e"/>
    <line x1="398" y1="68" x2="1260" y2="68" stroke="#1e1e1e" stroke-width="1"/>

    <!-- top bar: logo -->
    <text x="416" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#E82127" letter-spacing="1.5">TESLA REMOTE</text>
    <text x="551" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#3c3c3c">  |  Viewer</text>
    <!-- top bar: status (waiting) -->
    <circle cx="910" cy="44" r="4" fill="#3c3c3c"/>
    <text x="922" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#4a4a4a">Waiting for client on port 7788</text>

    <!-- traffic-light dots -->
    <circle cx="420" cy="39" r="5" fill="#FF5F57"/>
    <circle cx="436" cy="39" r="5" fill="#FEBC2E"/>
    <circle cx="452" cy="39" r="5" fill="#28C840"/>

    <!-- ── Remote-screen area (fake desktop preview) ── -->
    <rect x="398" y="68" width="862" height="462" fill="#0b0b0b"/>

    <!-- Fake desktop wallpaper inside server window -->
    <rect x="398" y="68" width="862" height="462" fill="url(#screen-grad)" opacity="0.35"/>

    <!-- Fake taskbar -->
    <rect x="398" y="482" width="862" height="48" fill="#0e0e0e" opacity="0.7"/>
    <!-- Taskbar icons placeholders -->
    <rect x="415" y="492" width="28" height="28" rx="4" fill="#1a1a1a"/>
    <rect x="451" y="492" width="28" height="28" rx="4" fill="#1a1a1a"/>
    <rect x="487" y="492" width="28" height="28" rx="4" fill="#1a1a1a"/>
    <!-- taskbar clock -->
    <text x="1230" y="511" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">11:57</text>

    <!-- Fake window on remote desktop -->
    <rect x="460" y="90" width="420" height="280" rx="6" fill="#141414" stroke="#2a2a2a" stroke-width="1" opacity="0.75"/>
    <rect x="460" y="90" width="420" height="30" rx="6" fill="#1a1a1a" opacity="0.75"/>
    <rect x="460" y="108" width="420" height="12" fill="#1a1a1a" opacity="0.75"/>
    <!-- fake window title -->
    <text x="670" y="111" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#444">  Document.txt – Notepad</text>
    <!-- fake text lines -->
    <rect x="476" y="140" width="240" height="5" rx="2" fill="#2a2a2a" opacity="0.8"/>
    <rect x="476" y="155" width="310" height="5" rx="2" fill="#2a2a2a" opacity="0.8"/>
    <rect x="476" y="170" width="280" height="5" rx="2" fill="#2a2a2a" opacity="0.8"/>
    <rect x="476" y="185" width="200" height="5" rx="2" fill="#2a2a2a" opacity="0.8"/>
    <rect x="476" y="210" width="260" height="5" rx="2" fill="#2a2a2a" opacity="0.8"/>
    <rect x="476" y="225" width="300" height="5" rx="2" fill="#2a2a2a" opacity="0.8"/>
    <rect x="476" y="240" width="180" height="5" rx="2" fill="#2a2a2a" opacity="0.8"/>

    <!-- Fake browser window -->
    <rect x="620" y="200" width="350" height="220" rx="6" fill="#131313" stroke="#252525" stroke-width="1" opacity="0.8"/>
    <rect x="620" y="200" width="350" height="30" rx="6" fill="#1a1a1a" opacity="0.8"/>
    <rect x="620" y="218" width="350" height="12" fill="#1a1a1a" opacity="0.8"/>
    <!-- url bar -->
    <rect x="660" y="206" width="230" height="16" rx="4" fill="#111111" opacity="0.8"/>
    <text x="775" y="218" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#444">https://github.com</text>
    <!-- fake browser content -->
    <rect x="635" y="242" width="120" height="8" rx="2" fill="#E82127" opacity="0.4"/>
    <rect x="635" y="260" width="300" height="5" rx="2" fill="#2a2a2a" opacity="0.8"/>
    <rect x="635" y="274" width="270" height="5" rx="2" fill="#2a2a2a" opacity="0.8"/>
    <rect x="635" y="288" width="290" height="5" rx="2" fill="#2a2a2a" opacity="0.8"/>
    <rect x="635" y="312" width="180" height="28" rx="4" fill="#1c1c1c" opacity="0.8"/>
    <rect x="825" y="312" width="120" height="28" rx="4" fill="#1c1c1c" opacity="0.8"/>

    <!-- ── Spinner overlay (centered in content area) ── -->
    <!-- Animated spinner: group rotates around center (829, 290) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 829 290" to="360 829 290" dur="1.4s" repeatCount="indefinite"/>
      <!-- 10 dots, fading from full opacity at 12 o'clock clockwise -->
      <circle cx="829"   cy="254"   r="5.5" fill="#E82127" opacity="1.00"/>
      <circle cx="850.9" cy="261.6" r="5.5" fill="#E82127" opacity="0.88"/>
      <circle cx="865.1" cy="280.0" r="5.5" fill="#E82127" opacity="0.74"/>
      <circle cx="864.5" cy="302.0" r="5.5" fill="#E82127" opacity="0.60"/>
      <circle cx="849.6" cy="319.8" r="5.5" fill="#E82127" opacity="0.46"/>
      <circle cx="829"   cy="326"   r="5.5" fill="#E82127" opacity="0.34"/>
      <circle cx="808.4" cy="319.8" r="5.5" fill="#E82127" opacity="0.24"/>
      <circle cx="793.5" cy="302.0" r="5.5" fill="#E82127" opacity="0.16"/>
      <circle cx="792.9" cy="280.0" r="5.5" fill="#E82127" opacity="0.09"/>
      <circle cx="807.1" cy="261.6" r="5.5" fill="#E82127" opacity="0.04"/>
    </g>

    <!-- waiting text -->
    <text x="829" y="362" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#CCCCCC">Waiting for connection...</text>
    <text x="829" y="386" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#3c3c3c">Give your IP to the remote user and have them start Tesla Remote Client.</text>
    <text x="829" y="415" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#8B1C20">Listening on port  7788</text>
  </g>

  <!-- window label -->
  <text x="829" y="548" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#3a3a3a">TeslaServer.exe  (Your Machine)</text>
</svg>
